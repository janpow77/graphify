[pruefprofile.pr]
werkzeuge = ["doku", "ruff", "pytest"]
ausloeser = ["lokal", "pr"]
autofix = false

[pruefprofile.pr.werkzeug.doku]
befehl = ["python3", "/home/janpow/Projekte/auditcore/scripts/docs/repository_doku_check.py", "."]

[pruefprofile.pr.werkzeug.ruff]
befehl = ["uv", "run", "--frozen", "ruff", "check", ".", "--output-format=json", "--exit-zero"]

[pruefprofile.pr.werkzeug.pytest]
befehl = ["uv", "run", "--frozen", "pytest", "tests/", "-q", "--junitxml={ausgabe}"]

[pruefprofile.semantic]
