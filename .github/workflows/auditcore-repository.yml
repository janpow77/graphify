name: Auditcore-Prüfung
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .auditcore-runner.toml
      - .github/workflows/auditcore-repository.yml
  push:
    branches: ["v8"]

permissions:
  contents: read

concurrency:
  group: auditcore-repository-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruefen:
    runs-on: ${{ fromJSON(vars.PUBLIC_CI_VM_ENABLED == 'true' && '["self-hosted","linux","x64","public-ci-vm"]' || '"ubuntu-latest"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: projekt
          persist-credentials: false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: janpow77/auditcore
          ref: 30807f4d0281340d88fa4c3ebf491e8017a72b31
          sparse-checkout: packages/auditcore_runner
          path: pruefwerkzeug
          persist-credentials: false

      - name: Gitleaks bereitstellen
        shell: bash
        run: |
          if command -v gitleaks >/dev/null; then exit 0; fi
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 --output gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          mkdir -p auditcore-bin
          tar -xzf gitleaks.tar.gz -C auditcore-bin gitleaks
          echo "$RUNNER_TEMP/auditcore-bin" >> "$GITHUB_PATH"

      - name: Arbeitsstand auf Zugangsdaten prüfen
        working-directory: projekt
        env:
          PYTHONPATH: ${{ github.workspace }}/pruefwerkzeug/packages/auditcore_runner/src
        run: python3 -m auditcore_runner lokal repository --host --ohne-cache
